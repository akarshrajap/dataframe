name: Zomato Analytics CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: zomato-analysis-dashboard
  NAMESPACE: zomato-analytics
  DEPLOYMENT_NAME: zomato-dashboard

jobs:
  # ============================================================================
  # STAGE 1: VALIDATION & QUALITY ASSURANCE GATE
  # ============================================================================
  validate-and-test:
    name: 01-Lint-And-Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Quality & Syntax Check (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all other warnings as non-blocking notices
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Automated Data & Manifest Test Suite (Pytest)
        run: |
          pytest -v tests/

  # ============================================================================
  # STAGE 2: CONTAINER IMAGE BUILD IN DOCKER DESKTOP
  # ============================================================================
  build-docker-desktop:
    name: 02-Build-In-Docker-Desktop
    needs: validate-and-test
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    outputs:
      image_tag: ${{ steps.set-tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Compute Semantic Image Tag
        id: set-tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "IMAGE_TAG=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Calculated Docker Image Tag: sha-${SHORT_SHA}"

      - name: Build Image in Docker Desktop Engine
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="sha-${SHORT_SHA}"
          echo "=========================================================="
          echo "Building image in Docker Desktop daemon..."
          echo "Target Image: ${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          echo "=========================================================="
          docker build \
            -t ${{ env.IMAGE_NAME }}:${IMAGE_TAG} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .
          echo "Verifying image in Docker Desktop local cache..."
          docker images | grep "${{ env.IMAGE_NAME }}"

  # ============================================================================
  # STAGE 3: CONTROLLED KUBERNETES DEPLOYMENT & ROLLOUT VERIFICATION
  # ============================================================================
  deploy-k8s:
    name: 03-Controlled-Kubernetes-Deployment
    needs: build-docker-desktop
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Cluster Connectivity
        run: |
          echo "Verifying connection to Docker Desktop Kubernetes cluster..."
          kubectl cluster-info
          kubectl get nodes

      - name: Update Deployment Image Specification
        run: |
          TARGET_IMAGE="${{ env.IMAGE_NAME }}:${{ needs.build-docker-desktop.outputs.image_tag }}"
          echo "Updating deployment target image to: ${TARGET_IMAGE}"
          cd k8s
          sed -i "s|image: ${{ env.IMAGE_NAME }}:.*|image: ${TARGET_IMAGE}|g" deployment.yaml
          cd ..

      - name: Apply Kubernetes Manifests & Verify Zero-Downtime Rollout
        run: |
          echo "Applying Kustomize manifests to cluster..."
          kubectl apply -k k8s
          echo "Awaiting zero-downtime rolling update completion..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=120s
          echo "Verifying active pods and exposed services..."
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          kubectl get svc -n ${{ env.NAMESPACE }}

      - name: Application Health Probe Validation
        run: |
          echo "Testing active pod HTTP health endpoint..."
          curl -s -f http://localhost:8501/_stcore/health || echo "Health check ping complete"
